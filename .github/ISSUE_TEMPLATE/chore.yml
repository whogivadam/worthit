name: Chore
description: Tooling, CI, dependencies, packaging or repository meta.
title: "chore(scope): "
labels: ["type:chore"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - repo
        - ci
        - deps
        - release
        - manifest
        - tests
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] `npm test` passes
        - [ ] `npm run lint` passes
        - [ ] CI is green
    validations:
      required: true
