name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      # The PR title becomes the squash commit on main, so it must satisfy the
      # same Conventional Commits rules as commitlint.config.js.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            popup
            overlay
            parser
            rates
            background
            calc
            manifest
            tests
            ci
            deps
            release
            repo
          requireScope: true
          # Only the trailing period is rejected here. Dependabot writes
          # "build(deps): Bump x from 4 to 7" and cannot be told to lower-case
          # "Bump", and because pr-title is a required check, a capitalised
          # subject would make every dependency PR unmergeable. Lower-case
          # subjects are still enforced for hand-written commits by commitlint.
          subjectPattern: ^(?!.*\.$).{1,}$
          subjectPatternError: |
            The subject "{subject}" must not end with a period.
          headerPattern: '^(\w*)(?:\(([\w$.\-*/ ]*)\))?!?: (.*)$'
