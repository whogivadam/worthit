name: Release

on:
  push:
    branches: [main]
  # Retry path for a submission that failed after the release already existed.
  # Re-running the release job does not help: release-please runs first, sees
  # the release, returns release_created false, and every later step is skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to submit to AMO, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Maintains a release PR; on merge it tags, writes CHANGELOG.md and bumps
      # the version in both package.json and manifest.json.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm test
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run check-zip
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run check-privacy
        if: ${{ steps.release.outputs.release_created }}

      - name: Attach unsigned zip to the GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG" web-ext-artifacts/*.zip --clobber

      # Submits the version to AMO for review. Users install from the AMO listing.
      # --approval-timeout=0 in the sign script returns once Mozilla accepts the
      # upload, rather than blocking until a human reviewer approves it: review
      # takes days, so waiting on it only ever times out and reports a submission
      # that worked as a failure. Approval arrives by email and the listing goes
      # live on its own. If this step does fail the release is already published,
      # so use the workflow_dispatch path above to submit the same tag again.
      - name: Submit to AMO for review
        if: ${{ steps.release.outputs.release_created }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run sign

      # The Chrome Web Store counterpart. It uploads and submits for review in
      # one call and returns; review is asynchronous and arrives by email, so
      # there is deliberately nothing to wait for here -- see the AMO step above.
      #
      # The very first submission of a new extension cannot come from here: an
      # item has no ID until a draft has been uploaded by hand in the developer
      # console, and cannot be published until its listing is complete. CI
      # handles every version after that one. See docs/chrome/README.md.
      #
      # continue-on-error, because the refresh token expires every 7 days: the
      # OAuth consent screen stays in Testing, which is what Google issues
      # short-lived tokens for, and leaving Testing needs a homepage and privacy
      # policy on a domain we own and have verified. Zip uploads by hand are the
      # accepted cost instead. This step runs last, after the tag, the GitHub
      # release and the AMO submission, so failing it would report a release
      # that worked as a release that did not. The summary says what is left to
      # do by hand.
      - name: Submit to the Chrome Web Store
        id: chrome
        if: ${{ steps.release.outputs.release_created }}
        continue-on-error: true
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: npm run publish:chrome

      - name: Say that Chrome needs a zip uploaded by hand
        if: ${{ steps.release.outputs.release_created && steps.chrome.outcome == 'failure' }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          {
            echo "### Chrome Web Store: upload the zip by hand"
            echo
            echo "\`npm run publish:chrome\` failed. Two causes are likely: the"
            echo "store refuses to publish over an item that is still in review, and"
            echo "the refresh token lasts only 7 days while the OAuth consent screen"
            echo "is in Testing. The log says which. See docs/chrome/README.md."
            echo
            echo "Everything else in this release succeeded: the tag, the GitHub"
            echo "release and the AMO submission. To finish Chrome, download the zip"
            echo "attached to the \`$TAG\` release and upload it at"
            echo "<https://chrome.google.com/webstore/devconsole/>."
          } >> "$GITHUB_STEP_SUMMARY"

  resubmit:
    name: resubmit
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # The tag is attacker-controllable input in the general case, so it is
      # passed through the environment rather than interpolated into the script.
      - name: Check the tag matches the version it carries
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not carry version $version"
            exit 1
          fi
          echo "submitting $version from $TAG"

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: npm run check-zip

      - run: npm run check-privacy

      - name: Submit to AMO for review
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run sign

      # Non-blocking for the same reason as the release job above.
      - name: Submit to the Chrome Web Store
        id: chrome
        continue-on-error: true
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: npm run publish:chrome

      - name: Say that Chrome needs a zip uploaded by hand
        if: ${{ steps.chrome.outcome == 'failure' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo "### Chrome Web Store: upload the zip by hand"
            echo
            echo "\`npm run publish:chrome\` failed for \`$TAG\`. Either the item is"
            echo "still in review, or the refresh token expired. See"
            echo "docs/chrome/README.md."
            echo
            echo "Build the zip with \`npm run build\` and upload it at"
            echo "<https://chrome.google.com/webstore/devconsole/>."
          } >> "$GITHUB_STEP_SUMMARY"
