name: Release

on:
  push:
    branches: [main]
  # Retry path for a submission that failed after the release already existed.
  # Re-running the release job does not help: release-please runs first, sees
  # the release, returns release_created false, and every later step is skipped.
  #
  # Pick the stores to retry. Nothing is submitted unless asked for, because a
  # store that already accepted the version does not want it again: AMO refuses
  # a version it has already signed, and re-submitting anywhere resets review
  # state. A failure is almost always one store, so the default is none and the
  # choice is explicit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to submit to the stores, e.g. v0.1.0"
        required: true
        type: string
      amo:
        description: "Submit to AMO (fails if that version is already signed)"
        type: boolean
        default: false
      chrome:
        description: "Submit to the Chrome Web Store"
        type: boolean
        default: false
      edge:
        description: "Submit to Microsoft Edge Add-ons"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Maintains a release PR; on merge it tags, writes CHANGELOG.md and bumps
      # the version in both package.json and manifest.json.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm test
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run check-zip
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run check-privacy
        if: ${{ steps.release.outputs.release_created }}

      - name: Attach unsigned zip to the GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG" web-ext-artifacts/*.zip --clobber

      # Submits the version to AMO for review. Users install from the AMO listing.
      # --approval-timeout=0 in the sign script returns once Mozilla accepts the
      # upload, rather than blocking until a human reviewer approves it: review
      # takes days, so waiting on it only ever times out and reports a submission
      # that worked as a failure. Approval arrives by email and the listing goes
      # live on its own. If this step does fail the release is already published,
      # so use the workflow_dispatch path above to submit the same tag again.
      - name: Submit to AMO for review
        if: ${{ steps.release.outputs.release_created }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run sign

      # The Chrome Web Store counterpart. It uploads and submits for review in
      # one call and returns; review is asynchronous and arrives by email, so
      # there is deliberately nothing to wait for here -- see the AMO step above.
      #
      # The very first submission of a new extension cannot come from here: an
      # item has no ID until a draft has been uploaded by hand in the developer
      # console, and cannot be published until its listing is complete. CI
      # handles every version after that one. See docs/chrome/README.md.
      #
      # continue-on-error, because the refresh token expires every 7 days: the
      # OAuth consent screen stays in Testing, which is what Google issues
      # short-lived tokens for, and leaving Testing needs a homepage and privacy
      # policy on a domain we own and have verified. So this step is expected to
      # fail and the zip is uploaded by hand at the developer console -- that is
      # the standing process for Chrome, not a fallback; the step is kept only
      # because it publishes for free whenever the token happens to be fresh.
      # It runs after the tag, the GitHub release and the AMO submission,
      # so failing it would report a release that worked as a release that did
      # not. The summary says what is left to do by hand.
      - name: Submit to the Chrome Web Store
        id: chrome
        if: ${{ steps.release.outputs.release_created }}
        continue-on-error: true
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: npm run publish:chrome

      - name: Say that Chrome needs a zip uploaded by hand
        if: ${{ steps.release.outputs.release_created && steps.chrome.outcome == 'failure' }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "::warning title=Chrome Web Store::$TAG was released but not published to Chrome. Upload the zip by hand -- see the summary."
          {
            echo "### Chrome Web Store: upload the zip by hand"
            echo
            echo "\`npm run publish:chrome\` failed. Two causes are likely: the"
            echo "store refuses to publish over an item that is still in review, and"
            echo "the refresh token lasts only 7 days while the OAuth consent screen"
            echo "is in Testing. The log says which. See docs/chrome/README.md."
            echo
            echo "Everything else in this release succeeded: the tag, the GitHub"
            echo "release and the AMO submission. Retry Chrome alone from the"
            echo "*Run workflow* button with **chrome** ticked, or run"
            echo
            echo "    npm run chrome:zip $TAG"
            echo
            echo "which downloads this release's zip -- the bytes CI built and sent"
            echo "to AMO -- checks it, and prints the path to upload at"
            echo "<https://chrome.google.com/webstore/devconsole/>. Do not build the"
            echo "zip from the working tree; it is a different artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      # Microsoft Edge Add-ons. Same shape as the Chrome step: upload, submit for
      # review, return; certification arrives by email. Not the same zip --
      # publish:edge derives an Edge package first, because Edge rejects a
      # manifest carrying both background keys. See scripts/lib/edge-package.mjs.
      #
      # Unlike Chrome, this step is expected to succeed, so a failure here is
      # something to act on. continue-on-error for the same reason as Chrome:
      # it runs after the release and the other stores, so failing it would
      # report a release that worked as one that did not.
      #
      # That is also why there is no red step to look for -- continue-on-error
      # reports this step's conclusion as success whatever happens. The signal
      # is the error annotation and summary the next step writes, which is what
      # v0.7.1 taught: it failed to reach Edge and reported success. See
      # docs/edge/README.md.
      - name: Submit to Microsoft Edge Add-ons
        id: edge
        if: ${{ steps.release.outputs.release_created }}
        continue-on-error: true
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: npm run publish:edge

      - name: Say that Edge needs finishing by hand
        if: ${{ steps.release.outputs.release_created && steps.edge.outcome == 'failure' }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "::error title=Microsoft Edge Add-ons::$TAG was released but not submitted to Edge. See the summary for what to do."
          {
            echo "### Microsoft Edge Add-ons: submit by hand"
            echo
            echo "\`npm run publish:edge\` failed. **The log above says why** --"
            echo "an expired API key, a malformed secret, a previous version"
            echo "still in review and a rejected package all land here. See"
            echo "docs/edge/README.md."
            echo
            echo "Everything else in this release succeeded. Once the cause is"
            echo "fixed, retry Edge alone: the Release workflow's *Run workflow*"
            echo "button, tag \`$TAG\`, with **edge** ticked and the others left"
            echo "clear. Or upload by hand:"
            echo
            echo "    npm run edge:zip $TAG"
            echo
            echo "which builds this release's Edge package -- not \`chrome:zip\`,"
            echo "which Partner Center rejects -- then upload it at"
            echo "<https://partner.microsoft.com/dashboard/microsoftedge/>."
          } >> "$GITHUB_STEP_SUMMARY"

  resubmit:
    name: resubmit
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # The tag is attacker-controllable input in the general case, so it is
      # passed through the environment rather than interpolated into the script.
      - name: Check the tag matches the version it carries
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not carry version $version"
            exit 1
          fi
          echo "submitting $version from $TAG"

      # Nothing is submitted unless a store was ticked, so say so rather than
      # running the whole build to reach no submission at all.
      - name: Check at least one store was chosen
        if: ${{ !inputs.amo && !inputs.chrome && !inputs.edge }}
        run: |
          echo "::error::Tick at least one store to submit to: amo, chrome or edge."
          exit 1

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: npm run check-zip

      - run: npm run check-privacy

      # Chrome and Edge first, then AMO. AMO is the strict one -- it refuses a
      # version it has already signed, and a retry is almost always for a
      # version AMO accepted -- so if it ran first and failed, the job would
      # stop before reaching the store that actually needed retrying. Running
      # it last keeps its failure honest without letting it block the others.
      #
      # Each store runs only when asked for. That, not the ordering, is what
      # makes a single-store retry possible.

      # Non-blocking for the same reason as the release job above.
      - name: Submit to the Chrome Web Store
        id: chrome
        if: ${{ inputs.chrome }}
        continue-on-error: true
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: npm run publish:chrome

      - name: Say that Chrome needs a zip uploaded by hand
        if: ${{ inputs.chrome && steps.chrome.outcome == 'failure' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "::warning title=Chrome Web Store::$TAG was released but not published to Chrome. Upload the zip by hand -- see the summary."
          {
            echo "### Chrome Web Store: upload the zip by hand"
            echo
            echo "\`npm run publish:chrome\` failed for \`$TAG\`. Either the item is"
            echo "still in review, or the refresh token expired. See"
            echo "docs/chrome/README.md."
            echo
            echo "Run \`npm run chrome:zip $TAG\` for this release's zip and upload"
            echo "it at <https://chrome.google.com/webstore/devconsole/>."
          } >> "$GITHUB_STEP_SUMMARY"

      # Non-blocking for the same reason as the release job above.
      - name: Submit to Microsoft Edge Add-ons
        id: edge
        if: ${{ inputs.edge }}
        continue-on-error: true
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: npm run publish:edge

      - name: Say that Edge needs finishing by hand
        if: ${{ inputs.edge && steps.edge.outcome == 'failure' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "::error title=Microsoft Edge Add-ons::$TAG was released but not submitted to Edge. See the summary for what to do."
          {
            echo "### Microsoft Edge Add-ons: submit by hand"
            echo
            echo "\`npm run publish:edge\` failed for \`$TAG\`. The log says why."
            echo "See docs/edge/README.md."
            echo
            echo "Run \`npm run edge:zip $TAG\` for this release's Edge package --"
            echo "not \`chrome:zip\`, which Partner Center rejects -- and upload it"
            echo "at <https://partner.microsoft.com/dashboard/microsoftedge/>."
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, and deliberately not continue-on-error: it only runs when asked
      # for, so a failure here is a real one worth going red for.
      - name: Submit to AMO for review
        if: ${{ inputs.amo }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run sign
