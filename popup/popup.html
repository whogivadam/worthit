<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Worth It?</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!--
      Text the user reads is tagged rather than written here: data-i18n sets
      textContent, data-i18n-title and data-i18n-aria-label set those attributes.
      popup.js applies them on open and again whenever the language changes, so
      the markup carries no English. "WORTH IT?" is the product name and stays.
    -->
    <header class="bar">
      <h1>WORTH IT?</h1>
      <button id="open-settings" class="icon" type="button" data-i18n-title="nav.settingsTitle" data-i18n="nav.settings"></button>
    </header>

    <!-- Manual check -->
    <main id="view-main" hidden>
      <div class="price-row">
        <span id="currency-symbol" class="symbol">$</span>
        <input
          id="price"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="0"
          data-i18n-aria-label="price.label"
        />
        <div class="combo" data-combo="source-currency">
          <input
            id="source-currency"
            class="combo-input"
            type="text"
            role="combobox"
            autocomplete="off"
            aria-expanded="false"
            aria-autocomplete="list"
            aria-controls="source-currency-list"
            data-i18n-aria-label="price.currencyLabel"
          />
          <ul id="source-currency-list" class="combo-list" role="listbox" hidden></ul>
        </div>
      </div>

      <section id="result" class="result" hidden>
        <p id="time" class="huge">&nbsp;</p>
        <p class="of-your-life" data-i18n="result.ofYourLife"></p>
        <p id="framing" class="framing"></p>
        <div id="blocks" class="blocks" aria-hidden="true"></div>
        <p id="overflow" class="overflow"></p>
        <button id="share" class="wide" type="button" data-i18n="result.copy"></button>
      </section>

      <p id="no-rate" class="warn-box" hidden></p>

      <section class="panel">
        <h2>
          <span data-i18n="history.title"></span>
          <span id="total" class="total"></span>
        </h2>
        <ol id="history-list" class="history"></ol>
        <p id="history-empty" class="muted" data-i18n="history.empty"></p>
        <button id="clear" class="wide ghost" type="button" data-i18n="history.clear"></button>
      </section>

      <section class="panel" id="site-panel">
        <h2 data-i18n="site.title"></h2>
        <p id="site-host" class="muted"></p>
        <label class="check">
          <input id="site-disabled" type="checkbox" />
          <span data-i18n="site.disable"></span>
        </label>
        <label class="field">
          <span data-i18n="site.forceCurrency"></span>
          <div class="combo" data-combo="site-currency">
          <input
            id="site-currency"
            class="combo-input"
            type="text"
            role="combobox"
            autocomplete="off"
            aria-expanded="false"
            aria-autocomplete="list"
            aria-controls="site-currency-list"
            data-i18n-aria-label="site.forceCurrency"
          />
          <ul id="site-currency-list" class="combo-list" role="listbox" hidden></ul>
        </div>
        </label>
      </section>

      <footer class="bar footer">
        <div>
          <p id="rate-status" class="muted"></p>
          <a
            id="attribution"
            href="https://www.exchangerate-api.com"
            target="_blank"
            rel="noreferrer"
            data-i18n="rates.attribution"
          ></a>
        </div>
        <button id="refresh" class="icon" type="button" data-i18n="rates.refresh"></button>
      </footer>
    </main>

    <!-- Settings. Shown automatically on first run, and never again once saved. -->
    <section id="view-settings" hidden>
      <p id="first-run" class="lead" hidden data-i18n="settings.firstRun"></p>

      <fieldset>
        <legend data-i18n="settings.income"></legend>
        <label class="radio">
          <input type="radio" name="income-mode" value="monthly" />
          <span data-i18n="settings.monthly"></span>
        </label>
        <input
          id="monthly"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          data-i18n-aria-label="settings.monthlyLabel"
        />
        <label class="radio">
          <input type="radio" name="income-mode" value="hourly" />
          <span data-i18n="settings.hourly"></span>
        </label>
        <input
          id="hourly"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          data-i18n-aria-label="settings.hourlyLabel"
        />
      </fieldset>

      <label class="field">
        <span data-i18n="settings.hoursPerWeek"></span>
        <input id="hours-per-week" type="text" inputmode="decimal" autocomplete="off" />
      </label>

      <label class="field">
        <span data-i18n="settings.homeCurrency"></span>
        <div class="combo" data-combo="home-currency">
          <input
            id="home-currency"
            class="combo-input"
            type="text"
            role="combobox"
            autocomplete="off"
            aria-expanded="false"
            aria-autocomplete="list"
            aria-controls="home-currency-list"
            data-i18n-aria-label="settings.homeCurrency"
          />
          <ul id="home-currency-list" class="combo-list" role="listbox" hidden></ul>
        </div>
      </label>

      <label class="field">
        <span data-i18n="settings.language"></span>
        <select id="language"></select>
      </label>

      <label class="check">
        <input id="overlay-enabled" type="checkbox" />
        <span data-i18n="settings.showBadges"></span>
      </label>

      <p id="settings-error" class="warn-box" hidden></p>

      <button id="save-settings" class="wide" type="button" data-i18n="settings.save"></button>
      <button id="cancel-settings" class="wide ghost" type="button" hidden data-i18n="settings.back"></button>
    </section>

    <script src="../lib/currencies.js"></script>
    <script src="../lib/parser.js"></script>
    <script src="../lib/calc.js"></script>
    <script src="../lib/i18n.js"></script>
    <script src="../lib/search.js"></script>
    <script src="../lib/rates.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
